<script>
(function(){
  "use strict";

  // ============================================================
  // STATE
  // Module-level singletons. There is only ever one session loaded,
  // so this is deliberately flat rather than an app object.
  // ============================================================

  /** Every track point, in file order. Enriched by computeDerived().
   *  @type {Array<{lat:number, lon:number, ele:?number, time:?Date,
   *                speed:number,   // m/s over the segment ENDING at this point
   *                dist:number,    // metres from previous point
   *                dt:number,      // seconds from previous point
   *                t:number,       // elapsed seconds since points[0]
   *                validSeg:boolean}>} */
  let points = [];

  /** Detected runs, sorted fastest-first (NOT chronological - index 0 is the
   *  fastest run of the session, which is what the sidebar ranks by).
   *  @type {Array<{startIdx:number, endIdx:number, peakIdx:number,
   *                maxSpeed:number, dur:number, dist:number,
   *                peakLat:number, peakLon:number,
   *                startT:number, endT:number}>} */
  let waves = [];

  /** False when the GPX has no <time> elements. Everything speed-related is
   *  then meaningless, so the timeline hides and the map shows route only. */
  let hasTime = true;

  /** Current display unit key into UNIT_FACTOR/UNIT_LABEL/DIST_LABEL. */
  let unit = "knots";

  /** Speed a segment must exceed to count as planing. Was a user-facing
   *  slider once; fixed now because 18 km/h separates planing from schlogging
   *  reliably enough that the dial wasn't earning its screen space. */
  const PLANING_THRESHOLD_KMH = 18;

  // MapLibre handles. The track lives in a single GeoJSON source ("track");
  // run pins, endpoints and the cursor dot are HTML markers.
  let map;

  /** The chosen time window, in elapsed seconds, or null for none.
   *  Set by clicking a run (which selects that run's extent) or by
   *  ctrl-dragging across the timeline. Drives the map highlight, the
   *  timeline shading and the summary chip. */
  let selection = null;   // {startT, endT}

  /** Best result per category, as returned by computeBests(). */
  let bests = [];

  /** Which category the results box is currently listing. */
  let selectedCategory = "peak";

  /** The rows currently shown in the results box, so clicks can resolve
   *  back to the stretch they came from. */
  let currentResults = [];

  // --- Timeline view state ---
  // The timeline is a window onto the session: [tlViewStart, +tlViewSpan]
  // in elapsed seconds. Zooming changes the span, scrubbing moves the cursor
  // and drags the window along when the cursor nears an edge.
  let tlViewStart = 0;      // elapsed seconds at the left edge of the plot
  let tlViewSpan = 0;       // seconds visible across the plot width
  let tlCursorIdx = 0;      // index into `points` of the scrub cursor
  let tlRafPending = false; // set while a redraw is queued, to coalesce redraws

  // Range-selection drag (ctrl/cmd + drag). Declared up here with the rest of
  // the timeline state because drawTimeline() reads them, and it must never
  // reach them before their declaration has run.
  let tlSelecting = false, tlSelAnchor = 0, tlSelCurrent = 0;

  /** 97th-percentile speed, used as the top of the colour ramp. A percentile
   *  rather than the true max so one GPS glitch doesn't wash out the palette. */
  let maxSpeedRef = 1;

  /** True when the loaded file supplies its own speed measurements, so the
   *  app is using those rather than differencing positions. Set by
   *  computeDerived and read by the distance categories. */
  let deviceSpeedInUse = false;

  /** Which point range the map view was last fitted to, as "from:to".
   *  Refitting only when this changes means redraws that don't alter what is
   *  shown - theme toggle, unit switch - leave your pan and zoom alone. */
  let lastFitKey = null;



  const UNIT_FACTOR = { knots: 1.943844, kmh: 3.6, mph: 2.236936 };
  const UNIT_LABEL  = { knots: "kn", kmh: "km/h", mph: "mph" };
  const DIST_LABEL  = { knots: "nm", kmh: "km", mph: "mi" };

  // ============================================================
  // UTILITIES
  // ============================================================

  /** Great-circle distance between two WGS84 coords, in metres.
   *  Plenty accurate at the scales involved (metres apart, 1Hz sampling). */
  function haversine(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  /** Human duration: "1h 41m" or "3m 20s". Used for the session-length stat,
   *  NOT for the timeline (which shows wall-clock time - see fmtWall). */
  function fmtDuration(sec){
    sec = Math.round(sec);
    const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
    if (h>0) return h+"h "+String(m).padStart(2,"0")+"m";
    return m+"m "+String(s).padStart(2,"0")+"s";
  }

  /** m/s -> current display unit. The single conversion chokepoint: internal
   *  maths stays in m/s so unit switching never loses precision. */
  function toUnit(speedMs){ return speedMs * UNIT_FACTOR[unit]; }

  /** Metres -> the distance unit that pairs with the current speed unit
   *  (knots->nautical miles, mph->statute miles, km/h->kilometres). */
  function toDistUnit(meters){
    if (unit==="knots") return meters/1852;
    if (unit==="mph") return meters/1609.344;
    return meters/1000;
  }

  /** Resolve a CSS custom property to its current value.
   *  Canvas and Leaflet both need literal colour strings, so anything drawn
   *  outside CSS has to look its colour up this way - that is what lets the
   *  map and timeline follow the light/dark theme. */
  function themeColor(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  /** Speed colour ramp: deep ocean blue -> seafoam -> sand -> coral.
   *  `t` is the normalised position of each stop along the ramp. */
  const COLOR_STOPS = [
    {t:0.00, rgb:[27,75,90]},     // deep ocean - slowest
    {t:0.40, rgb:[63,191,173]},   // seafoam
    {t:0.70, rgb:[242,184,75]},   // sand
    {t:1.00, rgb:[229,83,60]}     // coral - fastest
  ];
  /** Interpolates COLOR_STOPS for a given speed, normalised against
   *  maxSpeedRef. Shared by the map track, the timeline and the cursor dot so
   *  a colour means the same thing everywhere. */
  function colorForSpeed(speedMs){
    let t = maxSpeedRef > 0 ? speedMs / maxSpeedRef : 0;
    t = Math.max(0, Math.min(1, t));
    let a = COLOR_STOPS[0], b = COLOR_STOPS[COLOR_STOPS.length-1];
    for (let i=0;i<COLOR_STOPS.length-1;i++){
      if (t >= COLOR_STOPS[i].t && t <= COLOR_STOPS[i+1].t){ a = COLOR_STOPS[i]; b = COLOR_STOPS[i+1]; break; }
    }
    const span = (b.t - a.t) || 1;
    const lt = (t - a.t) / span;
    const r = Math.round(a.rgb[0] + (b.rgb[0]-a.rgb[0])*lt);
    const g = Math.round(a.rgb[1] + (b.rgb[1]-a.rgb[1])*lt);
    const bl = Math.round(a.rgb[2] + (b.rgb[2]-a.rgb[2])*lt);
    return `rgb(${r},${g},${bl})`;
  }

  /** Nearest-rank percentile. Small arrays, called rarely - the sort is fine. */
  function percentile(arr, p){
    if (!arr.length) return 0;
    const s = [...arr].sort((x,y)=>x-y);
    const idx = Math.min(s.length-1, Math.floor(p*s.length));
    return s[idx];
  }

  // ============================================================
  // GPX PARSING
  // ============================================================

  /** Parse GPX text into bare track points.
   *
   *  Deliberately tolerant: falls back to <rtept> if there are no <trkpt>,
   *  and drops points with unparseable coordinates rather than throwing.
   *  Devices vary a lot here - some write <speed> and <course> per point
   *  (we ignore those and derive speed ourselves, so every file is treated
   *  identically), some omit <ele>, some omit <time> entirely.
   *
   *  @param {string} xmlText raw file contents
   *  @returns {Array<{lat,lon,time,ele}>}
   *  @throws if the XML is malformed or contains no usable points
   */
  function parseGPX(xmlText){
    const doc = new DOMParser().parseFromString(xmlText, "application/xml");
    if (doc.querySelector("parsererror")) throw new Error("This file doesn't look like valid GPX/XML.");
    let pts = Array.from(doc.getElementsByTagName("trkpt"));
    if (pts.length === 0) pts = Array.from(doc.getElementsByTagName("rtept"));
    if (pts.length === 0) throw new Error("No track points found in this file.");
    return pts.map(pt => {
      const lat = parseFloat(pt.getAttribute("lat"));
      const lon = parseFloat(pt.getAttribute("lon"));
      const timeEl = pt.getElementsByTagName("time")[0];
      const eleEl = pt.getElementsByTagName("ele")[0];

      // Many speed-oriented trackers write a <speed> element: the receiver's
      // own Doppler measurement, in metres per second. Where it exists it
      // beats differencing positions, which measures the straight line
      // between fixes and inherits the error in both of them. On a real
      // session the two disagree by about 0.6 km/h at peak, with position
      // maths reading low. Files without it fall back to derived speed.
      const speedEl = pt.getElementsByTagName("speed")[0];
      const devSpeed = speedEl ? parseFloat(speedEl.textContent) : NaN;

      return {
        lat, lon,
        deviceSpeed: Number.isFinite(devSpeed) && devSpeed >= 0 ? devSpeed : undefined,
        time: timeEl ? new Date(timeEl.textContent) : null,
        ele: eleEl ? parseFloat(eleEl.textContent) : null
      };
    }).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon));
  }

  /** Parse a Locosys .sbp log (GT-11, GT-31, GW-52, GW-60).
   *
   *  Layout per the SiRF Binary (Packed) documentation at
   *  logiqx.github.io/gps-wizard/formats/sbp.html - "Geodetic Navigation
   *  Data, Message ID 41", 32 bytes per record, all little-endian:
   *
   *      +0   uint8   HDOP, resolution 0.2
   *      +1   uint8   number of satellites in fix
   *      +2   uint16  UTC milliseconds
   *      +4   uint32  UTC packed datetime (see below)
   *      +8   uint32  satellite ID list
   *      +12  int32   latitude,  1e-7 degrees
   *      +16  int32   longitude, 1e-7 degrees
   *      +20  int32   altitude above MSL, cm
   *      +24  uint16  speed over ground, cm/s
   *      +26  uint16  course over ground, 0.01 degrees
   *      +28  int16   climb rate, cm/s
   *      +30  uint8   speed dilution of precision, 0.01 m/s
   *      +31  uint8   vertical SDOP, 0.01 m/s
   *
   *  The file is preceded by a 64-byte header carrying a SiRF frame with an
   *  ASCII device string, e.g. "BHaacke,168600967,2,V1.2A0314B,2.0h,00".
   *
   *  PACKED DATETIME. A full UTC timestamp squeezed into 32 bits:
   *
   *      bits  0-5    seconds
   *      bits  6-11   minutes
   *      bits 12-16   hours
   *      bits 17-21   day of month
   *      bits 22-31   months since January 2000
   *
   *  The month field counts months rather than storing year and month
   *  separately, so December leaves a remainder of zero and belongs to the
   *  previous year - handled below.
   *
   *  SPEED. The device's own Doppler measurement is used rather than
   *  differencing positions: at 5 Hz, position noise produces spikes of 50+
   *  knots where the receiver correctly reports single figures.
   *
   *  @param {ArrayBuffer} buffer raw file bytes
   *  @returns {Array<{lat,lon,ele,time,deviceSpeed}>}
   */
  function parseSBP(buffer){
    const dv = new DataView(buffer);
    const HEADER_BYTES = 0x40, REC = 32;
    if (dv.byteLength < HEADER_BYTES + REC){
      throw new Error("This .sbp file is too short to contain any track data.");
    }

    const pts = [];
    for (let off = HEADER_BYTES; off + REC <= dv.byteLength; off += REC){
      const lat = dv.getInt32(off + 12, true) / 1e7;
      const lon = dv.getInt32(off + 16, true) / 1e7;
      // Skip records without a usable fix rather than letting them drag the
      // track off to null island.
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
      if (lat < -90 || lat > 90 || lon < -180 || lon > 180) continue;
      if (lat === 0 && lon === 0) continue;

      const packed = dv.getUint32(off + 4, true);
      const sec   =  packed        & 0x3F;
      const mins  = (packed >>> 6) & 0x3F;
      const hour  = (packed >>> 12) & 0x1F;
      const day   = (packed >>> 17) & 0x1F;
      const months = packed >>> 22;
      let year  = 2000 + Math.floor(months / 12);
      let month = months % 12;
      if (month === 0){ month = 12; year -= 1; }

      // Sub-second precision comes from the millisecond field; its whole
      // seconds duplicate what the packed value already gives.
      const subMs = dv.getUint16(off + 2, true) % 1000;

      const t = Date.UTC(year, month - 1, day, hour, mins, sec, subMs);
      if (!Number.isFinite(t)) continue;

      pts.push({
        lat, lon,
        ele: dv.getInt32(off + 20, true) / 100,
        time: new Date(t),
        deviceSpeed: dv.getUint16(off + 24, true) / 100
      });
    }

    if (pts.length < 2) throw new Error("No usable track points found in this .sbp file.");
    return pts;
  }

  /** Annotate points in place with distance  /** Annotate points in place with distance, delta-time, speed and elapsed
   *  time, and set the module-level `hasTime` flag.
   *
   *  Speed is derived from consecutive positions rather than read from any
   *  <speed> element, so all devices are handled the same way.
   *
   *  The `validSeg` flag marks segments safe to compute speed from. A segment
   *  is invalid when dt <= 0 (duplicate or out-of-order timestamps) or
   *  dt > 30s (a recording gap - the tracker lost signal or was paused).
   *  Dividing a large distance by a large dt across a gap would invent a
   *  plausible-looking but fictional speed, so those segments are excluded
   *  from stats and drawn as a dashed line on the map instead.
   *
   *  @param {Array} pts from parseGPX()
   *  @returns {Array} the same array, mutated
   */
  function computeDerived(pts){
    hasTime = pts.every(p => p.time instanceof Date && !isNaN(p.time));
    // .sbp logs carry the device's own Doppler speed, which beats
    // differencing positions - see parseSBP for why it matters.
    const useDeviceSpeed = pts.some(p => typeof p.deviceSpeed === "number");
    // Remembered so the distance categories can integrate the same source
    // instead of re-deciding from a single sample.
    deviceSpeedInUse = useDeviceSpeed;
    const t0 = hasTime ? pts[0].time.getTime() : 0;

    pts[0].speed = useDeviceSpeed ? (pts[0].deviceSpeed || 0) : 0;
    pts[0].dist = 0; pts[0].dt = 0; pts[0].t = 0;
    pts[0].isGap = true; pts[0].validSeg = false;

    for (let i=1;i<pts.length;i++){
      const p0 = pts[i-1], p1 = pts[i];
      const dist = haversine(p0.lat,p0.lon,p1.lat,p1.lon);
      let dt = 0;
      if (hasTime) dt = (p1.time.getTime() - p0.time.getTime())/1000;

      // A gap is a break in recording: the map draws these dashed rather
      // than pretending you travelled in a straight line at speed.
      const isGap = !(hasTime && dt > 0 && dt <= 30);

      p1.dist = dist;
      p1.dt = dt;
      p1.isGap = isGap;

      if (useDeviceSpeed){
        // The reading is instantaneous and stays trustworthy across a gap,
        // so it is kept; only the interpolated line is treated as suspect.
        p1.speed = typeof p1.deviceSpeed === "number"
          ? p1.deviceSpeed
          : (dt > 0 && dt <= 30 ? dist/dt : 0);   // fall back for a missing sample
        p1.validSeg = hasTime && dt > 0;
      } else {
        p1.validSeg = !isGap;
        p1.speed = p1.validSeg ? dist/dt : 0;
      }

      p1.t = hasTime ? (p1.time.getTime()-t0)/1000 : i;
    }
    return pts;
  }

  // ============================================================
  // BEST RESULTS
  // The categories speedsurfers actually compare: peak speed plus the best
  // average over a fixed time or a fixed distance. A 2-second average is a
  // far better measure of a session than an instantaneous maximum, which one
  // noisy fix can inflate.
  // ============================================================

  const BEST_CATEGORIES = [
    { key: "peak", label: "Top speed",     type: "instant" },
    { key: "s2",   label: "2 sec",         type: "time",     amount: 2    },
    { key: "m100", label: "100 m",         type: "distance", amount: 100  },
    { key: "m250", label: "250 m",         type: "distance", amount: 250  },
    { key: "m500", label: "500 m",         type: "distance", amount: 500  },
    { key: "nm",   label: "Nautical mile", type: "distance", amount: 1852 },
  ];

  /** How many ranked results to list for a category. */
  const RESULTS_PER_CATEGORY = 10;

  /** Best average speed for each category, with the stretch that produced it.
   *
   *  Sliding window, one pass per category. Two details matter:
   *
   *  DISTANCE SOURCE. Where the device reports Doppler speed, distance is
   *  integrated from it rather than summed from position deltas. At 5 Hz,
   *  GPS jitter inflates path length by several percent - on a real session
   *  here, 5.25 km by positions against 5.04 km by Doppler - which would
   *  flatter every distance category.
   *
   *  GAPS. A window is never allowed to span a break in recording, since the
   *  straight line across a gap is not distance you actually sailed.
   *
   *  @returns {Array} one entry per category that could be satisfied
   */
  function computeBests(){
    if (!hasTime || points.length < 2) return [];
    const n = points.length;
    const useSpeed = deviceSpeedInUse;

    const cum = new Float64Array(n);   // cumulative distance
    const tt  = new Float64Array(n);   // elapsed time
    tt[0] = points[0].t;
    for (let i = 1; i < n; i++){
      const p = points[i];
      const step = useSpeed ? Math.max(0, p.speed) * p.dt : (p.dist || 0);
      cum[i] = cum[i-1] + step;
      tt[i]  = p.t;
    }

    const out = [];
    for (const cat of BEST_CATEGORIES){
      if (cat.type === "instant"){
        let bi = -1, best = 0;
        for (let i = 0; i < n; i++){
          if (points[i].validSeg && points[i].speed > best){ best = points[i].speed; bi = i; }
        }
        if (bi >= 0){
          out.push(Object.assign({}, cat, { speed: best, startIdx: bi, endIdx: bi,
                                            startT: points[bi].t, endT: points[bi].t }));
        }
        continue;
      }

      const wins = categoryWindows(cat, cum, tt, 1);
      if (wins.length) out.push(Object.assign({}, cat, wins[0]));
    }
    return out;
  }

  /** Ranked, non-overlapping windows for one category, best first.
   *
   *  One candidate window is formed per end-point, then the best are taken
   *  greedily, skipping any that overlap one already chosen. Without the
   *  overlap rule the "top ten" would just be ten shifted copies of the same
   *  few seconds of sailing.
   */
  function categoryWindows(cat, cum, tt, limit){
    const n = points.length;
    const cands = [];
    let i = 0, floor = 0;

    for (let j = 1; j < n; j++){
      if (points[j].isGap){ floor = j; i = j; continue; }
      if (i < floor) i = floor;

      const reach = (k) => cat.type === "distance" ? (cum[j] - cum[k]) : (tt[j] - tt[k]);
      while (i + 1 <= j && reach(i + 1) >= cat.amount) i++;
      if (i < floor || reach(i) < cat.amount) continue;

      const time = tt[j] - tt[i];
      if (time <= 0) continue;
      cands.push({ speed: (cum[j] - cum[i]) / time, startIdx: i, endIdx: j,
                   startT: points[i].t, endT: points[j].t });
    }

    cands.sort((a, b) => b.speed - a.speed);
    const chosen = [];
    for (const c of cands){
      if (chosen.some(o => c.startIdx <= o.endIdx && c.endIdx >= o.startIdx)) continue;
      chosen.push(c);
      if (chosen.length >= limit) break;
    }
    return chosen;
  }

  /** The ranked result list for whichever category is selected.
   *  "Top speed" is special-cased to the detected planing runs, which is the
   *  more useful reading of "my fastest moments" than ten adjacent samples
   *  off the same peak. */
  function resultsForCategory(key){
    const cat = BEST_CATEGORIES.find(c => c.key === key);
    if (!cat || !hasTime || points.length < 2) return [];

    if (cat.type === "instant"){
      return waves.map(w => ({
        speed: w.maxSpeed, startIdx: w.startIdx, endIdx: w.endIdx,
        startT: w.startT, endT: w.endT, isRun: true
      }));
    }

    const n = points.length;
    const useSpeed = deviceSpeedInUse;
    const cum = new Float64Array(n), tt = new Float64Array(n);
    tt[0] = points[0].t;
    for (let i = 1; i < n; i++){
      const p = points[i];
      cum[i] = cum[i-1] + (useSpeed ? Math.max(0, p.speed) * p.dt : (p.dist || 0));
      tt[i] = p.t;
    }
    return categoryWindows(cat, cum, tt, RESULTS_PER_CATEGORY);
  }

  /** Find "runs": stretches where speed stays above a threshold.
   *
   *  A simple state machine - open a run when speed crosses the threshold,
   *  extend it while it stays above, close it when it drops. Runs shorter
   *  than minDurationSec are discarded so a single noisy GPS sample doesn't
   *  register as a run.
   *
   *  NOTE the return order: sorted by max speed DESCENDING, not by time. The
   *  sidebar is a leaderboard. Anything needing chronological order should
   *  sort by startT itself.
   *
   *  @param {Array} pts annotated points
   *  @param {number} thresholdMs threshold in m/s
   *  @param {number} minDurationSec discard runs shorter than this
   *  @returns {Array} runs, fastest first
   */
  function detectWaves(pts, thresholdMs, minDurationSec){
    const runs = [];
    let run = null;
    for (let i=1;i<pts.length;i++){
      const p = pts[i];
      if (p.validSeg && p.speed >= thresholdMs){
        if (!run) run = {startIdx:i-1, endIdx:i, dist:0, dur:0, maxSpeed:0, peakIdx:i};
        run.endIdx = i;
        run.dist += p.dist;
        run.dur += p.dt;
        if (p.speed > run.maxSpeed){ run.maxSpeed = p.speed; run.peakIdx = i; }
      } else {
        if (run){ runs.push(run); run = null; }
      }
    }
    if (run) runs.push(run);
    return runs.filter(r => r.dur >= minDurationSec).map(r => ({
      ...r,
      peakLat: pts[r.peakIdx].lat,
      peakLon: pts[r.peakIdx].lon,
      startT: pts[r.startIdx].t,
      endT: pts[r.endIdx].t
    })).sort((a,b) => b.maxSpeed - a.maxSpeed);
  }

  // ============================================================
  // MAP RENDERING
  // ============================================================

  /** Basemap style URLs. Vector rather than raster: sharper at every zoom,
   *  no "API key required" watermark, and the service CARTO continues to
   *  update. */
  const BASEMAP_STYLES = {
    light: "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json",
    dark:  "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json"
  };

  /** The basemap has its own light/dark setting, independent of the app's
   *  theme: a dark interface around a light map is a perfectly reasonable
   *  thing to want, and the map is the thing you actually read. */
  let basemapMode = "light";

  /** CARTO's vector basemaps need no API key today. If that changes, or you
   *  want your usage counted against your own allowance, put a key here and
   *  it is appended to the style URL:
   *
   *      const CARTO_KEY = "your-key";
   *      return CARTO_KEY ? base + "?key=" + encodeURIComponent(CARTO_KEY) : base;
   */
  function styleUrl(){
    return BASEMAP_STYLES[basemapMode === "dark" ? "dark" : "light"];
  }

  /** True once the style has loaded and it is safe to add sources/layers. */
  let mapReady = false;

  /** Set while a basemap swap is in flight, so the styledata handler knows
   *  the difference between "the style was replaced" and ordinary tile
   *  traffic - the latter fires the same event constantly. */
  let styleSwapPending = false;

  /** Current theme. Declared here rather than beside the toggle because
   *  other code reads it while the map is being built. */
  let currentTheme = "dark";

  /** Create the map. Called once, lazily, on the first successful load. */
  function initMap(){
    map = new maplibregl.Map({
      container: "map",
      style: styleUrl(),
      center: [0, 0],
      zoom: 1,
      attributionControl: true,
      // The arrow keys belong to the timeline cursor, not to panning.
      keyboard: false,
      // Flat map: tilt and rotation only get in the way of reading a track.
      pitchWithRotate: false,
      dragRotate: false,
      // A GPS track never spans the antimeridian in practice, so there is no
      // reason to render duplicate worlds either side of it.
      renderWorldCopies: false,
      // No cross-fade between zoom levels: tiles appear as soon as they are
      // ready, which reads as faster even though it is the same work.
      fadeDuration: 0
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-left");
    map.touchZoomRotate.disableRotation();

    wireSmoothZoom();

    map.on("load", () => {
      mapReady = true;
      if (points.length){
        try { drawTrack(); updateCursorMarker(); } catch (e){ console.error("First draw failed:", e); }
      }
    });

    // A style swap drops every custom source and layer, so rebuild once the
    // replacement has settled. styledata also fires for ordinary tile
    // activity, so the flag keeps this from doing anything during normal
    // panning and zooming.
    map.on("styledata", () => {
      if (!styleSwapPending || !mapReady || !points.length) return;
      if (!map.getSource("track")){
        try {
          drawTrack();
          updateCursorMarker();
          styleSwapPending = false;
        } catch (e){ /* style still settling; retried on the next event */ }
      }
    });

    wireMapClick();
  }

  /** Continuous wheel zoom.
   *
   *  Two problems with the stock handler. It applies each notch as its own
   *  discrete step, which reads as jumpy; and it derives the step size from
   *  the raw wheel delta, a number that differs between browser engines, so
   *  the same scroll travelled a different distance in the desktop app than
   *  in a browser.
   *
   *  This keeps a TARGET zoom and asks MapLibre to animate towards it once
   *  per wheel event. Notches arriving in quick succession push the target
   *  further out and the in-flight animation simply retargets, so a fast
   *  scroll is one continuous movement rather than a queue of little jumps.
   *
   *  An earlier version drove the camera itself every animation frame. That
   *  fired the full move-event cascade sixty times a second, which cost more
   *  than it bought - MapLibre's own animation loop does the same job with a
   *  fraction of the overhead.
   */
  function wireSmoothZoom(){
    map.scrollZoom.disable();

    // Tuning. STEP is how far one notch travels, EASE_MS how long it takes.
    // Bigger step = faster; longer ease = smoother but less immediate.
    const STEP     = 0.42;
    const EASE_MS  = 190;
    const MAX_MULT = 2.5;    // clamp, so a violent flick cannot teleport

    let target = null, idle = null;
    const container = map.getCanvasContainer();

    container.addEventListener("wheel", (e) => {
      e.preventDefault();

      // deltaMode: 0 = pixels, 1 = lines, 2 = pages. Normalise to pixels,
      // then to "notches" - a mouse reports about 100 per notch, a trackpad
      // streams much smaller values.
      let delta = e.deltaY;
      if (e.deltaMode === 1) delta *= 16;
      else if (e.deltaMode === 2) delta *= 100;

      const mult = Math.min(MAX_MULT, Math.max(0.2, Math.abs(delta) / 100));
      const dir  = delta > 0 ? -1 : 1;
      const scale = e.ctrlKey ? 2 : 1;      // trackpad pinch feels better faster

      const from = target === null ? map.getZoom() : target;
      target = Math.max(map.getMinZoom(),
               Math.min(map.getMaxZoom(), from + dir * STEP * mult * scale));

      // Zoom about the pointer so whatever is under the cursor stays put.
      const rect = container.getBoundingClientRect();
      const around = map.unproject([e.clientX - rect.left, e.clientY - rect.top]);

      map.easeTo({
        zoom: target,
        around,
        duration: EASE_MS,
        easing: (t) => t,        // linear, so chained notches do not stutter
      });

      // Once scrolling stops, forget the target - otherwise a later pan or a
      // fitBounds would be fighting a stale value.
      clearTimeout(idle);
      idle = setTimeout(() => { target = null; }, 260);
    }, { passive: false });
  }

  /** Point the map at a different basemap style, keeping the current view. */
  function setBasemapStyle(){
    if (!map) return;
    styleSwapPending = true;
    // setStyle keeps the camera, and the rebuild that follows should not
    // re-fit: swapping the basemap must not throw away where you were
    // looking. lastFitKey is deliberately left alone.
    map.setStyle(styleUrl());
  }

  /** Create the data layers once. Everything the app draws on the map lives
   *  in GeoJSON sources rendered by MapLibre itself.
   *
   *  This matters for more than tidiness: HTML markers are repositioned by
   *  JavaScript on every frame, so a screenful of them visibly lags behind
   *  while panning. Layers are drawn by the GPU in the same pass as the
   *  basemap, so they are welded to the map however fast you drag it.
   */
  function ensureMapLayers(){
    if (map.getSource("track")) return;

    const empty = { type: "FeatureCollection", features: [] };
    map.addSource("track",  { type: "geojson", data: empty });
    map.addSource("ends",   { type: "geojson", data: empty });
    map.addSource("runs",   { type: "geojson", data: empty });
    map.addSource("cursor", { type: "geojson", data: empty });

    // Recording gaps: a faint thin line rather than a dashed one.
    //
    // line-dasharray is the one line property MapLibre cannot leave to the
    // GPU - the dash pattern is rebuilt on the CPU every time the zoom level
    // changes, which showed up as stutter while zooming. A solid line at low
    // opacity reads the same at a glance and costs nothing.
    map.addLayer({
      id: "track-gap", type: "line", source: "track",
      filter: ["==", ["get", "gap"], true],
      layout: { "line-cap": "butt", "line-join": "round" },
      paint: { "line-color": ["get", "color"], "line-width": 1.5,
               "line-opacity": 0.45 }
    });
    map.addLayer({
      id: "track-line", type: "line", source: "track",
      filter: ["!=", ["get", "gap"], true],
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": ["get", "color"], "line-width": 4, "line-opacity": 0.94 }
    });

    map.addLayer({
      id: "ends-dots", type: "circle", source: "ends",
      paint: {
        "circle-radius": 6,
        "circle-color": ["get", "color"],
        "circle-stroke-width": 2,
        "circle-stroke-color": themeColor("--marker-stroke")
      }
    });

    map.addLayer({
      id: "run-dots", type: "circle", source: "runs",
      paint: {
        "circle-radius": 7,
        "circle-color": themeColor("--coral"),
        "circle-stroke-width": 1.5,
        "circle-stroke-color": themeColor("--marker-stroke")
      }
    });
    map.addLayer({
      id: "run-labels", type: "symbol", source: "runs",
      layout: {
        "text-field": ["get", "rank"],
        "text-font": ["Open Sans Bold"],
        "text-size": 9,
        "text-allow-overlap": true,
        "text-ignore-placement": true
      },
      paint: { "text-color": "#ffffff" }
    });

    map.addLayer({
      id: "cursor-dot", type: "circle", source: "cursor",
      paint: {
        "circle-radius": 7,
        "circle-color": themeColor("--coral"),
        "circle-stroke-width": 2.5,
        "circle-stroke-color": themeColor("--text")
      }
    });
  }

  /** Refresh the paint colours that come from the app's theme. */
  function updateMapPaint(){
    if (!map || !map.getLayer("ends-dots")) return;
    map.setPaintProperty("ends-dots", "circle-stroke-color", themeColor("--marker-stroke"));
    map.setPaintProperty("run-dots", "circle-color", themeColor("--coral"));
    map.setPaintProperty("run-dots", "circle-stroke-color", themeColor("--marker-stroke"));
    map.setPaintProperty("cursor-dot", "circle-color", themeColor("--coral"));
    map.setPaintProperty("cursor-dot", "circle-stroke-color", themeColor("--text"));
  }

  /** Build the track, endpoints and run pins as GeoJSON and hand them over.
   *
   *  Band merging keeps the feature count in the dozens rather than the
   *  thousands; colour then comes from a per-feature property, so the whole
   *  track is drawn in a single pass.
   */
  function drawTrack(){
    if (!map || !mapReady) return;
    ensureMapLayers();

    const MAX_MAP_SEGMENTS = 1500;
    const BANDS = 14;
    const bandOf = (speedMs) => {
      const t = Math.max(0, Math.min(1, speedMs / maxSpeedRef));
      return Math.min(BANDS-1, Math.floor(t * BANDS));
    };

    // With a selection, draw ONLY that stretch - the rest is left off the map
    // rather than dimmed, so the selected part keeps its own speed colours.
    const sel = selectionRange();
    const from = sel ? sel[0] : 0;
    const to   = sel ? sel[1] : points.length - 1;
    const stride = Math.max(1, Math.ceil((to - from) / MAX_MAP_SEGMENTS));

    const features = [];
    let currentBand = null, currentPath = [], currentValid = null;
    let minLng = Infinity, minLat = Infinity, maxLng = -Infinity, maxLat = -Infinity;

    const flush = () => {
      if (currentPath.length < 2) return;
      const mid = (currentBand + 0.5) / BANDS * maxSpeedRef;
      features.push({
        type: "Feature",
        properties: {
          gap: !currentValid,
          color: currentValid
            ? (hasTime ? colorForSpeed(mid) : themeColor("--seafoam"))
            : themeColor("--track-gap")
        },
        geometry: { type: "LineString", coordinates: currentPath.slice() }
      });
    };

    for (let i=from; i<=to; i+=stride){
      const p = points[i];
      const coord = [p.lon, p.lat];          // GeoJSON is lng,lat
      if (p.lon < minLng) minLng = p.lon;
      if (p.lon > maxLng) maxLng = p.lon;
      if (p.lat < minLat) minLat = p.lat;
      if (p.lat > maxLat) maxLat = p.lat;

      const valid = !hasTime || !p.isGap;
      const band = (valid && hasTime) ? bandOf(p.speed) : -1;
      if (band !== currentBand || valid !== currentValid){
        flush();
        currentPath = currentPath.length ? [currentPath[currentPath.length-1], coord] : [coord];
        currentBand = band;
        currentValid = valid;
      } else {
        currentPath.push(coord);
      }
    }
    if ((to - from) % stride !== 0){
      const endPt = points[to];
      currentPath.push([endPt.lon, endPt.lat]);
    }
    flush();

    map.getSource("track").setData({ type: "FeatureCollection", features });

    // ---- endpoints ----
    const first = points[from], last = points[to];
    map.getSource("ends").setData({
      type: "FeatureCollection",
      features: [
        { type:"Feature", properties:{ color: themeColor("--sand") },
          geometry:{ type:"Point", coordinates:[first.lon, first.lat] } },
        { type:"Feature", properties:{ color: themeColor("--text") },
          geometry:{ type:"Point", coordinates:[last.lon, last.lat] } }
      ]
    });

    // ---- run pins, only those inside what is drawn ----
    const runFeatures = [];
    waves.forEach((w, idx) => {
      if (w.peakIdx < from || w.peakIdx > to) return;
      runFeatures.push({
        type: "Feature",
        properties: { rank: String(idx + 1) },
        geometry: { type: "Point", coordinates: [w.peakLon, w.peakLat] }
      });
    });
    map.getSource("runs").setData({ type:"FeatureCollection", features: runFeatures });

    // ---- fit, but only when what is shown has actually changed ----
    const fitKey = from + ":" + to;
    if (fitKey !== lastFitKey && isFinite(minLng)){
      if (minLng !== maxLng || minLat !== maxLat){
        map.fitBounds([[minLng, minLat], [maxLng, maxLat]],
                      { padding: 55, maxZoom: 18, animate: false });
      } else {
        map.jumpTo({ center: [minLng, minLat], zoom: Math.min(map.getZoom(), 18) });
      }
      lastFitKey = fitKey;
    }
  }

  /** Draw the category picker. Each row shows that category's best result,
   *  and selecting one swaps the result list below. */
  function renderBests(){
    const el = document.getElementById("bestPanel");
    el.innerHTML = "";
    if (!hasTime){
      el.innerHTML = `<div class="best-empty">No timestamps in this file, so speeds can't be measured.</div>`;
      return;
    }
    bests = computeBests();
    if (!bests.length){
      el.innerHTML = `<div class="best-empty">Session too short to measure these categories.</div>`;
      return;
    }

    // Fall back to the first available category if the selected one can't be
    // measured in this session (a short session has no nautical mile).
    if (!bests.some(b => b.key === selectedCategory)) selectedCategory = bests[0].key;

    bests.forEach(b => {
      const chip = document.createElement("div");
      chip.className = "best-chip" + (b.key === selectedCategory ? " active" : "");
      chip.setAttribute("role", "button");
      chip.setAttribute("tabindex", "0");
      chip.innerHTML = `<span class="cat">${b.label}</span>` +
                       `<span class="val">${toUnit(b.speed).toFixed(2)}<small>${UNIT_LABEL[unit]}</small></span>`;
      const pick = () => {
        selectedCategory = b.key;
        clearSelection();
        renderBests();
        renderWaveList();
      };
      chip.addEventListener("click", pick);
      chip.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(); }
      });
      el.appendChild(chip);
    });
  }

  /** Populate the results box for the selected category. Rows are ranked
   *  best first and clicking one selects that stretch. */
  function renderWaveList(){
    const el = document.getElementById("waveList");
    const title = document.getElementById("resultsTitle");
    el.innerHTML = "";

    if (!hasTime){
      title.textContent = "Results";
      el.innerHTML = `<div class="no-waves">This file has no timestamps, so speed can't be calculated — the route is shown on the map only.</div>`;
      return;
    }

    const cat = BEST_CATEGORIES.find(c => c.key === selectedCategory);
    const rows = resultsForCategory(selectedCategory);
    title.textContent = cat
      ? (cat.type === "instant" ? "Fastest runs" : "Best " + cat.label + " stretches")
      : "Results";

    if (!rows.length){
      el.innerHTML = `<div class="no-waves">Nothing to show for this category in this session.</div>`;
      return;
    }

    currentResults = rows;
    const top = rows[0].speed || 1;

    rows.forEach((r, idx) => {
      const div = document.createElement("div");
      div.className = "wave-item";
      const secs = (r.endT - r.startT);
      div.innerHTML = `
        <div class="wave-rank">${idx+1}</div>
        <div class="wave-info">
          <div class="top"><b>${toUnit(r.speed).toFixed(2)} ${UNIT_LABEL[unit]}</b></div>
          <div class="sub">at ${fmtWall(r.startT, true)}${secs > 0 ? " &middot; " + secs.toFixed(1) + "s" : ""}</div>
        </div>
        <div class="wave-go">&rsaquo;</div>`;

      // Bar length is relative to the best result in this list, so the shape
      // of the session is visible at a glance. Scaled from 35% so slower
      // entries still register as bars rather than slivers.
      const frac = Math.max(0, Math.min(1, r.speed / top));
      div.style.setProperty("--bar", (35 + frac * 65).toFixed(1) + "%");

      div.addEventListener("click", () => focusResult(idx));
      el.appendChild(div);
    });
  }

  /** Select a row from the results box: highlight the stretch it came from. */
  function focusResult(idx){
    const r = currentResults[idx];
    if (!r) return;
    document.querySelectorAll(".wave-item").forEach((n,i) => n.classList.toggle("pulse", i===idx));
    setSelection(r.startT, r.endT);
    setCursorToTime(r.startT);
  }

  // ============================================================
  // SELECTION
  // A time window, chosen either by clicking a run or by ctrl-dragging on
  // the timeline. One piece of state drives three views: the map highlight,
  // the timeline shading, and the summary chip.
  // ============================================================

  /** Indices of the points falling inside the selected window. */
  function selectionRange(){
    if (!selection) return null;
    const a = idxAtTime(selection.startT);
    let b = idxAtTime(selection.endT);
    if (b < a) b = a;
    return [a, b];
  }

  /** Distance, duration and speeds for the selected window. */
  function selectionStats(){
    const range = selectionRange();
    if (!range) return null;
    const [a, b] = range;
    let dist = 0, maxSpeed = 0, movingTime = 0;
    for (let i = a + 1; i <= b; i++){
      const p = points[i];
      dist += p.dist || 0;
      if (p.validSeg){
        movingTime += p.dt;
        if (p.speed > maxSpeed) maxSpeed = p.speed;
      }
    }
    const dur = points[b].t - points[a].t;
    // Average over elapsed time, matching how the session stats read.
    const avg = dur > 0 ? dist / dur : 0;
    return { dist, dur, maxSpeed, avg, movingTime };
  }

  function updateSelectionChip(){
    const chip = document.getElementById("tlSel");
    const text = document.getElementById("tlSelText");
    const st = selectionStats();
    if (!st){ chip.classList.remove("on"); text.textContent = ""; return; }
    chip.classList.add("on");
    text.innerHTML =
      `${fmtWall(selection.startT, true)} &rarr; ${fmtWall(selection.endT, true)}` +
      ` &middot; ${st.dur.toFixed(0)}s` +
      ` &middot; ${toDistUnit(st.dist).toFixed(2)} ${DIST_LABEL[unit]}` +
      ` &middot; max <b>${toUnit(st.maxSpeed).toFixed(1)}</b>` +
      ` &middot; avg ${toUnit(st.avg).toFixed(1)} ${UNIT_LABEL[unit]}`;
  }

  /** Redraw the map for the current selection.
   *
   *  There is no highlight overlay: drawTrack() simply renders the selected
   *  stretch and nothing else, so the visible line keeps its ordinary speed
   *  colours. Fitting the view is left to drawTrack's own fitBounds, which
   *  is already computed from whatever it drew. */
  function drawSelectionOnMap(){
    if (!map) return;
    try { drawTrack(); } catch (e){ console.error("Map redraw failed:", e); }
  }

  /** Set the selected window. Times may arrive in either order. */
  function setSelection(t0, t1, opts){
    opts = opts || {};
    const lo = Math.min(t0, t1), hi = Math.max(t0, t1);
    // A ctrl-click with no drag is a clear, not a zero-width selection.
    if (hi - lo < 1){ clearSelection(); return; }
    selection = { startT: lo, endT: hi };
    drawSelectionOnMap();
    updateSelectionChip();
    scheduleTimeline();
  }

  function clearSelection(){
    const had = selection !== null;
    selection = null;
    document.querySelectorAll(".wave-item").forEach(n => n.classList.remove("pulse"));
    updateSelectionChip();
    // Only redraw if something was actually showing, so this stays cheap
    // when called during setup.
    if (had) drawSelectionOnMap();
    scheduleTimeline();
  }

  // ============================================================
  // TIMELINE
  // ------------------------------------------------------------
  // A hand-written <canvas> chart of speed (y) against wall-clock time (x).
  //
  // WHY NOT A CHARTING LIBRARY
  // This started on Chart.js and did not survive contact with real data. A
  // 100-minute session at 1Hz is ~6,000 points; asking a general-purpose
  // library to draw that many bezier segments with per-point colours was slow
  // enough that the chart effectively never appeared.
  //
  // The fix is the standard audio-waveform trick: you only have as many pixel
  // columns as the canvas is wide, so for each column find the min and max
  // speed in the time slice it covers and draw one vertical line between
  // them. Cost is O(visible pixels), not O(points), and no spike is ever
  // averaged away - a 1-second peak still paints a full-height column. A full
  // session renders in about 5ms and stays that fast at any zoom.
  //
  // VIEW MODEL
  //   tlViewStart / tlViewSpan  the visible time window, in elapsed seconds
  //   tlCursorIdx               the scrub cursor, an index into `points`
  // Arrow keys move the cursor; the window follows when the cursor nears an
  // edge (ensureCursorVisible). Zoom keeps the cursor anchored in place.
  //
  // TIME DISPLAY
  // Internally everything is elapsed seconds - simpler maths, and it is what
  // `points[i].t` holds. Only at label time is it converted to wall-clock via
  // wallDate(), using the browser's local timezone. Axis ticks are aligned to
  // round clock boundaries (12:30, 13:00), not to when recording started.
  // ============================================================

  // Session bounds in elapsed seconds. sessionDur() floors at 1 to keep it
  // safe as a divisor for degenerate single-point files.
  function sessionStart(){ return points[0].t; }
  function sessionEnd(){ return points[points.length-1].t; }
  function sessionDur(){ return Math.max(1, sessionEnd() - sessionStart()); }

  /** Binary search for the first point at or after an elapsed time.
   *  Called once per pixel column per frame, so it needs to stay O(log n).
   *  Always returns a valid in-range index (clamps at both ends). */
  function idxAtTime(tSec){
    let lo = 0, hi = points.length - 1;
    while (lo < hi){
      const mid = (lo + hi) >> 1;
      if (points[mid].t < tSec) lo = mid + 1; else hi = mid;
    }
    return lo;
  }

  /** Top of the y-axis in display units: true session max plus 12% headroom
   *  so the fastest peak doesn't touch the ceiling. Uses the real max, not a
   *  percentile - clipping your best run off the top of the chart would be
   *  worse than a slightly generous scale. */
  function tlMaxSpeedUnit(){
    let mx = 0;
    for (const p of points) if (p.validSeg && p.speed > mx) mx = p.speed;
    return Math.max(0.1, toUnit(mx) * 1.12);
  }

  /** Pick a human tick interval (5s, 30s, 5min, 30min...) that yields roughly
   *  targetTicks labels across the given span. */
  function niceTimeStep(spanSec, targetTicks){
    const raw = spanSec / targetTicks;
    const steps = [5,10,15,30,60,120,300,600,900,1800,3600,7200];
    for (const s of steps) if (raw <= s) return s;
    return 7200;
  }

  // Wall-clock helpers: elapsed seconds -> the real time of day the tracker
  // recorded, shown in the viewer's local timezone.
  function wallDate(tSec){
    const base = points[0].time.getTime();
    return new Date(base + (tSec - points[0].t) * 1000);
  }

  /** Clock readings, in the viewer's local time.
   *
   *  Both formats record UTC - GPX timestamps carry a Z, and the .sbp packed
   *  datetime is UTC by specification - so this converts. Local is what the
   *  session actually felt like: the hour you were on the water. */
  function fmtWall(tSec, withSeconds){
    const d = wallDate(tSec);
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    if (!withSeconds) return `${hh}:${mm}`;
    return `${hh}:${mm}:${String(d.getSeconds()).padStart(2,"0")}`;
  }

  // Local seconds-since-midnight for a given elapsed time, so axis ticks can be
  // aligned to round clock boundaries rather than to when recording started.
  function wallSecOfDay(tSec){
    const d = wallDate(tSec);
    return d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
  }

  /** Coalesce redraw requests into one per animation frame. Scrubbing fires
   *  far more events than the screen can show; without this, held arrow keys
   *  or a drag would queue redundant full redraws. */
  function scheduleTimeline(){
    if (tlRafPending) return;
    tlRafPending = true;
    requestAnimationFrame(() => { tlRafPending = false; drawTimeline(); });
  }

  /** Draw the whole timeline. Full repaint each time - cheap enough that
   *  partial invalidation isn't worth the complexity.
   *
   *  Layer order (back to front): grid + speed labels, speed envelope,
   *  planing threshold, time axis, run bands, cursor.
   *
   *  The canvas is sized to devicePixelRatio (capped at 2) for crisp lines on
   *  retina screens without quadrupling fill cost on a 3x phone.
   *
   *  padL/padR/padT/padB define the plot box. If you change padL, change it
   *  in timeAtClientX() too or clicks will land offset from the cursor. */
  function drawTimeline(){
    const canvas = document.getElementById("timelineCanvas");
    if (!canvas || !points.length) return;
    const cssW = canvas.clientWidth, cssH = canvas.clientHeight;
    if (cssW < 10 || cssH < 10) return;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(cssW*dpr) || canvas.height !== Math.round(cssH*dpr)){
      canvas.width = Math.round(cssW*dpr);
      canvas.height = Math.round(cssH*dpr);
    }
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);

    const padL = 38, padR = 8, padT = 10, padB = 18;
    const plotW = cssW - padL - padR;
    const plotH = cssH - padT - padB;
    if (plotW < 10 || plotH < 10) return;

    const yMax = tlMaxSpeedUnit();
    const yOf = v => padT + plotH - (v / yMax) * plotH;
    const xOf = t => padL + ((t - tlViewStart) / tlViewSpan) * plotW;

    // ---- horizontal grid + speed labels
    // Ticks land on round numbers (10, 20, 30…) instead of arbitrary fractions
    // of the peak. The unit lives in the header above, so the axis stays as
    // bare numbers.
    // Canvas takes a literal font string - it can't read CSS variables.
    // Keep in sync with --font-body.
    // Canvas can't read CSS variables directly, so resolve them once per draw.
    // This is what makes the timeline follow the light/dark theme.
    const cGrid   = themeColor("--grid");
    const cText   = themeColor("--text-dim");
    const cThresh = themeColor("--thresh-line");
    const cCursor = themeColor("--cursor-line");
    const cBand   = themeColor("--run-band");
    const cDim    = themeColor("--sel-dim");
    const cSelEdge = themeColor("--sel-edge");
    const cStroke = themeColor("--marker-stroke");

    ctx.font = "10px 'Open Sans', system-ui, sans-serif";
    ctx.textBaseline = "middle";
    ctx.textAlign = "right";

    const unitEl = document.getElementById("tlUnit");
    if (unitEl) unitEl.textContent = `speed in ${UNIT_LABEL[unit]}`;

    const niceSteps = [1,2,2.5,5,10,15,20,25,50,100];
    let yStep = niceSteps[niceSteps.length-1];
    for (const s of niceSteps){ if (s >= yMax/5){ yStep = s; break; } }

    const tickVals = [];
    for (let v = yStep; v <= yMax; v += yStep) tickVals.push(v);

    // zero line, drawn without a label so it doesn't crowd the time axis below
    ctx.strokeStyle = cGrid;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, yOf(0) + 0.5); ctx.lineTo(cssW - padR, yOf(0) + 0.5); ctx.stroke();

    tickVals.forEach((v) => {
      const y = yOf(v);
      ctx.strokeStyle = cGrid;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, y + 0.5); ctx.lineTo(cssW - padR, y + 0.5); ctx.stroke();
      ctx.fillStyle = cText;
      ctx.fillText(Number.isInteger(v) ? String(v) : v.toFixed(1), padL - 8, y);
    });

    // ---- speed envelope, one column per pixel
    const secPerPx = tlViewSpan / plotW;
    for (let px = 0; px < plotW; px++){
      const t0 = tlViewStart + px * secPerPx;
      const t1 = t0 + secPerPx;
      let i0 = idxAtTime(t0), i1 = idxAtTime(t1);
      if (i1 <= i0) i1 = Math.min(points.length - 1, i0 + 1);
      let mn = Infinity, mx = -Infinity;
      for (let i = i0; i <= i1 && i < points.length; i++){
        const p = points[i];
        if (!p.validSeg) continue;
        const v = toUnit(p.speed);
        if (v < mn) mn = v;
        if (v > mx) mx = v;
      }
      if (mn === Infinity) continue;
      const x = padL + px + 0.5;
      ctx.strokeStyle = colorForSpeed(mx / UNIT_FACTOR[unit]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, yOf(mn));
      ctx.lineTo(x, yOf(mx) - 0.8);
      ctx.stroke();
    }

    // ---- planing threshold
    const threshUnit = toUnit(PLANING_THRESHOLD_KMH / 3.6);
    if (threshUnit < yMax){
      const y = yOf(threshUnit);
      ctx.save();
      ctx.setLineDash([4,4]);
      ctx.strokeStyle = cThresh;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, y + 0.5); ctx.lineTo(cssW - padR, y + 0.5); ctx.stroke();
      ctx.restore();
    }

    // ---- time axis (real clock time, ticks on round clock boundaries)
    const step = niceTimeStep(tlViewSpan, 6);
    const startWall = wallSecOfDay(tlViewStart);
    const firstOffset = (Math.ceil(startWall / step) * step) - startWall;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillStyle = cText;
    for (let t = tlViewStart + firstOffset; t <= tlViewStart + tlViewSpan; t += step){
      const x = xOf(t);
      if (x < padL - 1 || x > cssW - padR + 1) continue;
      ctx.strokeStyle = cGrid;
      ctx.beginPath(); ctx.moveTo(x + 0.5, padT); ctx.lineTo(x + 0.5, padT + plotH); ctx.stroke();
      ctx.fillText(fmtWall(t, step < 60), x, padT + plotH + 4);
    }

    // ---- run bands (so you can see where the fast stretches are)
    waves.forEach(w => {
      const x0 = xOf(w.startT), x1 = xOf(w.endT);
      if (x1 < padL || x0 > cssW - padR) return;
      ctx.fillStyle = cBand;
      ctx.fillRect(Math.max(padL, x0), padT, Math.min(cssW - padR, x1) - Math.max(padL, x0), plotH);
    });

    // ---- selection: dim everything outside the chosen window, and mark
    // its edges. Drawn after the trace so the dimming actually reads.
    const activeSel = tlSelecting ? { startT: Math.min(tlSelAnchor, tlSelCurrent),
                                      endT:   Math.max(tlSelAnchor, tlSelCurrent) }
                                  : selection;
    if (activeSel){
      const sx0 = Math.max(padL, xOf(activeSel.startT));
      const sx1 = Math.min(cssW - padR, xOf(activeSel.endT));

      ctx.fillStyle = cDim;
      if (sx0 > padL) ctx.fillRect(padL, padT, sx0 - padL, plotH);
      if (sx1 < cssW - padR) ctx.fillRect(sx1, padT, (cssW - padR) - sx1, plotH);

      if (sx1 > sx0){
        ctx.strokeStyle = cSelEdge;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(sx0 + 0.5, padT); ctx.lineTo(sx0 + 0.5, padT + plotH);
        ctx.moveTo(sx1 - 0.5, padT); ctx.lineTo(sx1 - 0.5, padT + plotH);
        ctx.stroke();

        // little handles top and bottom, so the edges read as grabbable bounds
        ctx.fillStyle = cSelEdge;
        [sx0, sx1].forEach(x => {
          ctx.fillRect(x - 1.5, padT, 3, 5);
          ctx.fillRect(x - 1.5, padT + plotH - 5, 3, 5);
        });
      }
    }

    // ---- cursor
    const cp = points[tlCursorIdx];
    if (cp){
      const cx = xOf(cp.t);
      if (cx >= padL && cx <= cssW - padR){
        ctx.strokeStyle = cCursor;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(cx + 0.5, padT); ctx.lineTo(cx + 0.5, padT + plotH); ctx.stroke();
        const cy = yOf(toUnit(cp.speed));
        ctx.fillStyle = colorForSpeed(cp.speed);
        ctx.strokeStyle = cStroke;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx, cy, 4.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      }
    }
  }

  /** Update the text readout beside the timeline title: clock time, speed at
   *  the cursor, and which run the cursor sits inside (if any). */
  function updateReadout(){
    const el = document.getElementById("tlReadout");
    const p = points[tlCursorIdx];
    if (!p){ el.textContent = ""; return; }
    const inRun = waves.findIndex(w => p.t >= w.startT && p.t <= w.endT);
    const runTxt = inRun >= 0 ? ` &middot; in run ${inRun+1}` : "";
    el.innerHTML = `<span class="t">${fmtWall(p.t, true)}</span> &middot; <b>${toUnit(p.speed).toFixed(1)} ${UNIT_LABEL[unit]}</b>${runTxt}`;
  }

  /** Move (or lazily create) the map dot that tracks the timeline cursor, so
   *  scrubbing the graph shows you where on the water that moment happened. */
  function updateCursorMarker(){
    const p = points[tlCursorIdx];
    if (!p || !map) return;
    if (!mapReady || !map.getSource("cursor")) return;
    // Drawn as a layer, not an HTML marker: markers are moved by JavaScript
    // every frame and visibly trail behind while panning.
    map.getSource("cursor").setData({
      type: "FeatureCollection",
      features: [{ type:"Feature", properties:{},
                   geometry:{ type:"Point", coordinates:[p.lon, p.lat] } }]
    });
  }

  /** Index of the track point nearest a clicked position, or -1 if the click
   *  was too far from the track to mean anything.
   *
   *  Only points currently drawn are considered, so clicking while a run is
   *  selected can't jump you somewhere off-screen. Note a track that crosses
   *  itself is inherently ambiguous - several passes over the same water are
   *  equally "nearest", and the earliest of them wins. */
  function nearestPointIndex(latlng, maxPixels){
    if (!points.length || !map) return -1;
    const range = selectionRange();
    const from = range ? range[0] : 0;
    const to   = range ? range[1] : points.length - 1;

    // Coarse pass in degree space (cheap), scaled so longitude doesn't
    // dominate at this latitude.
    const cosLat = Math.cos(latlng.lat * Math.PI / 180);
    let bestIdx = -1, bestD2 = Infinity;
    for (let i = from; i <= to; i++){
      const dLat = points[i].lat - latlng.lat;
      const dLon = (points[i].lon - latlng.lng) * cosLat;
      const d2 = dLat*dLat + dLon*dLon;
      if (d2 < bestD2){ bestD2 = d2; bestIdx = i; }
    }
    if (bestIdx < 0) return -1;

    // Then confirm in screen space, so the tolerance means the same thing at
    // every zoom level.
    const a = map.project(latlng);
    const b = map.project([points[bestIdx].lon, points[bestIdx].lat]);
    const px = Math.sqrt((a.x-b.x)*(a.x-b.x) + (a.y-b.y)*(a.y-b.y));
    return px <= maxPixels ? bestIdx : -1;
  }

  /** Scroll the view window if the cursor has come within 12% of an edge,
   *  so arrowing off-screen pulls the timeline along instead of losing it. */
  function ensureCursorVisible(){
    const t = points[tlCursorIdx].t;
    const margin = tlViewSpan * 0.12;
    if (t < tlViewStart + margin) tlViewStart = t - margin;
    else if (t > tlViewStart + tlViewSpan - margin) tlViewStart = t - tlViewSpan + margin;
    clampView();
  }

  /** Keep the view window inside the session bounds. */
  function clampView(){
    const maxStart = sessionEnd() - tlViewSpan;
    if (tlViewStart > maxStart) tlViewStart = maxStart;
    if (tlViewStart < sessionStart()) tlViewStart = sessionStart();
  }

  /** Move the cursor by N points and resync readout, map dot and canvas.
   *  Note it steps by INDEX, not by time: one press = one GPS sample, which
   *  is one second on typical 1Hz trackers. */
  function moveCursor(deltaIdx){
    tlCursorIdx = Math.max(0, Math.min(points.length - 1, tlCursorIdx + deltaIdx));
    ensureCursorVisible();
    updateReadout();
    updateCursorMarker();
    scheduleTimeline();
  }

  /** Jump the cursor to a given elapsed time. Used by click/drag scrubbing
   *  and by sidebar run clicks. */
  function setCursorToTime(tSec){
    tlCursorIdx = idxAtTime(tSec);
    ensureCursorVisible();
    updateReadout();
    updateCursorMarker();
    scheduleTimeline();
  }

  /** Zoom about the cursor (factor < 1 zooms in, > 1 out), holding the cursor
   *  at the same screen position so you don't lose your place. Clamped between
   *  a 20s floor and the full session. */
  function zoomTimeline(factor){
    const anchor = points[tlCursorIdx] ? points[tlCursorIdx].t : tlViewStart + tlViewSpan/2;
    const rel = (anchor - tlViewStart) / tlViewSpan;
    const minSpan = Math.min(20, sessionDur());
    tlViewSpan = Math.max(minSpan, Math.min(sessionDur(), tlViewSpan * factor));
    tlViewStart = anchor - rel * tlViewSpan;
    clampView();
    scheduleTimeline();
  }

  /** Reset the timeline for a newly loaded session: full zoom out, cursor at
   *  the start, stale map dot cleared. */
  function initTimeline(){
    clearSelection();
    tlViewStart = sessionStart();
    tlViewSpan = sessionDur();
    tlCursorIdx = 0;
    if (map && mapReady && map.getSource("cursor")){
      map.getSource("cursor").setData({ type:"FeatureCollection", features: [] });
    }
    updateReadout();
    updateCursorMarker();
    scheduleTimeline();
  }

  /** Fill the four header stats. Distance sums every segment (including
   *  invalid ones - you did still travel that ground); speed stats use only
   *  valid segments so recording gaps can't fake a top speed. */
  function renderStats(){
    const validPts = points.filter(p=>p.validSeg);
    const totalDist = points.reduce((s,p)=>s+(p.dist||0),0);
    const totalDur = hasTime ? (points[points.length-1].t - points[0].t) : null;
    const maxSpeed = validPts.length ? Math.max(...validPts.map(p=>p.speed)) : 0;

    document.getElementById("mDist").textContent = toDistUnit(totalDist).toFixed(2) + " " + DIST_LABEL[unit];
    document.getElementById("mDuration").textContent = totalDur!=null ? fmtDuration(totalDur) : "—";
    document.getElementById("mMaxSpeed").textContent = hasTime ? toUnit(maxSpeed).toFixed(1) + " " + UNIT_LABEL[unit] : "—";
    document.getElementById("mWaves").textContent = hasTime ? waves.length : "—";
  }

  /** Re-derive runs and redraw everything. Called on load and whenever the
   *  display unit changes.
   *
   *  ORDER MATTERS: stats and the run list are rendered first, then the map
   *  and timeline inside try/catch. If a heavy canvas/map draw ever fails on
   *  some device, the numbers are already on screen rather than the page
   *  ending up blank. (This is exactly how an earlier bug presented, so the
   *  ordering is intentional - please keep it.) */
  /** Set the reference speed the colour ramp is scaled against.
   *
   *  A 97th percentile rather than the true maximum, so one bad fix can't
   *  wash out the whole palette. Lives here rather than inside drawTrack
   *  because the timeline needs it too, and the timeline can render before
   *  the map style has finished loading.
   */
  function computeSpeedRef(){
    const speeds = points.filter(p => p.validSeg).map(p => p.speed);
    maxSpeedRef = speeds.length ? percentile(speeds, 0.97) : 1;
    if (maxSpeedRef <= 0) maxSpeedRef = 1;
  }

  function rebuildAll(){
    const threshMs = PLANING_THRESHOLD_KMH/3.6;
    waves = hasTime ? detectWaves(points, threshMs, 1.2) : [];
    computeSpeedRef();
    // Stats first: even if map rendering hits a browser limit below,
    // the numbers the person actually asked for are already on screen.
    renderStats();
    renderBests();
    renderWaveList();
    try { drawTrack(); } catch (e){ console.error("Map rendering failed:", e); }
    try {
      if (hasTime) scheduleTimeline();
    } catch (e){ console.error("Timeline rendering failed:", e); }
  }

  // ============================================================
  // LOAD FLOW
  // ============================================================

  /** Take raw points, run the pipeline, swap the UI from dropzone to
   *  dashboard. The brief setTimeout lets the layout settle so Leaflet and
   *  the canvas measure a real size before their first draw.
   *  @param {Array} rawPoints from parseGPX() or parseSBP()
   *  @param {string} label shown under the title (usually the filename) */
  function loadPoints(rawPoints, label){
    try {
      if (rawPoints.length < 2) throw new Error("Not enough track points in this file.");
      points = computeDerived(rawPoints);
      lastFitKey = null;   // new session: always fit, even if the range key repeats
      document.getElementById("emptyWrap").style.display = "none";
      document.getElementById("dash").style.display = "flex";
      document.getElementById("sessionMeta").style.display = "flex";
      document.getElementById("tagline").textContent = label || "Session loaded.";
      if (!map) initMap();
      setTimeout(() => {
        try {
          map.resize();
          rebuildAll();
          if (hasTime){
            document.getElementById("timeline").style.display = "flex";
            initTimeline();
          } else {
            document.getElementById("timeline").style.display = "none";
          }
        }
        catch (e){ console.error("Rendering the session failed:", e); showError("Something went wrong rendering this session — the console has details."); }
      }, 60);
    } catch (e){
      showError(e.message);
    }
  }

  /** Surface a message in the dropzone. Parse/read failures only. */
  function showError(msg){
    // The message lives inside the dropzone, so make sure the dropzone is
    // actually on screen. Picking an unreadable file while a session is open
    // would otherwise fail in silence.
    showDropzone();
    const el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.style.display = "block";
  }

  /** Read a File (from the picker or a drop) and push it through the pipeline. */
  function handleFile(file){
    document.getElementById("errorMsg").style.display = "none";
    const label = file.name.replace(/\.(gpx|sbp)$/i, "");
    const isBinary = /\.sbp$/i.test(file.name);
    const reader = new FileReader();

    reader.onload = () => {
      try {
        const pts = isBinary
          ? parseSBP(reader.result)
          : parseGPX(reader.result);
        loadPoints(pts, label);
      } catch (e){ showError(e.message); }
    };
    reader.onerror = () => showError("Couldn't read that file.");

    // .sbp is binary, .gpx is XML text - they need different read modes.
    if (isBinary) reader.readAsArrayBuffer(file);
    else reader.readAsText(file);
  }

  // ============================================================
  // UI WIRING
  // File picker, drag & drop, unit switch, basemap panel.
  // ============================================================
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("fileInput");

  document.getElementById("chooseFileBtn").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); });

  ["dragenter","dragover"].forEach(evt => dropzone.addEventListener(evt, (e) => {
    e.preventDefault(); dropzone.classList.add("drag");
  }));
  ["dragleave","drop"].forEach(evt => dropzone.addEventListener(evt, (e) => {
    e.preventDefault(); dropzone.classList.remove("drag");
  }));
  dropzone.addEventListener("drop", (e) => {
    const f = e.dataTransfer.files[0];
    if (f) handleFile(f);
  });

  // ---------------- Display menu ----------------
  const displayBtn  = document.getElementById("displayBtn");
  const displayMenu = document.getElementById("displayMenu");

  function setMenu(open){
    displayMenu.classList.toggle("is-hidden", !open);
    displayBtn.setAttribute("aria-expanded", open ? "true" : "false");
  }

  displayBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    setMenu(displayMenu.classList.contains("is-hidden"));
  });

  // Clicks inside the panel must not close it - changing units and then the
  // basemap in one visit is the normal case.
  displayMenu.addEventListener("click", (e) => e.stopPropagation());

  document.addEventListener("click", () => setMenu(false));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !displayMenu.classList.contains("is-hidden")) setMenu(false);
  });

  // Straight to the file picker rather than back to the dropzone: with a
  // session already open, the dropzone is a step you have to click through
  // rather than something you wanted to see. The current session stays put
  // until a new file is actually chosen, so cancelling leaves you where you
  // were instead of on an empty screen.
  document.getElementById("newFileBtn").addEventListener("click", () => {
    setMenu(false);
    if (points.length){
      fileInput.value = "";      // so re-picking the same file still fires
      fileInput.click();
      return;
    }
    showDropzone();
  });

  /** Return to the empty state. */
  function showDropzone(){
    document.getElementById("emptyWrap").style.display = "flex";
    document.getElementById("dash").style.display = "none";
    document.getElementById("timeline").style.display = "none";
    document.getElementById("sessionMeta").style.display = "none";
    document.getElementById("tagline").textContent = "Your GPS Tracker";
  }

  document.getElementById("unitSeg").addEventListener("click", (e) => {
    const btn = e.target.closest("button"); if (!btn) return;
    unit = btn.dataset.unit;
    document.querySelectorAll("#unitSeg button").forEach(b => b.classList.toggle("active", b===btn));
    if (points.length){ rebuildAll(); updateReadout(); updateSelectionChip(); }
  });

  // ---------------- Theme ----------------
  // Dark is the default; the toggle flips a data-theme attribute on <html>
  // and every colour follows, because they all resolve from CSS variables.
  // The map and timeline need an explicit redraw since their colours were
  // baked into canvas/Leaflet at draw time rather than being live CSS.
  function applyTheme(mode){
    const root = document.documentElement;
    if (mode === "light") root.setAttribute("data-theme", "light");
    else root.removeAttribute("data-theme");

    const btn = document.getElementById("themeToggle");
    btn.setAttribute("aria-pressed", mode === "light" ? "true" : "false");
    document.getElementById("themeIcon").textContent  = mode === "light" ? "☀" : "☾";
    document.getElementById("themeLabel").textContent = mode === "light" ? "Light" : "Dark";

    // The basemap has its own control now, so a theme change only repaints
    // the app's own layers.
    if (map && mapReady){
      try { updateMapPaint(); drawTrack(); } catch (e){ console.error("Map repaint failed:", e); }
    }
    if (points.length && hasTime){ updateCursorMarker(); scheduleTimeline(); }
  }

  document.getElementById("themeToggle").addEventListener("click", () => {
    currentTheme = currentTheme === "dark" ? "light" : "dark";
    applyTheme(currentTheme);
  });

  // ---------------- Desktop shell hook ----------------
  // The Tauri wrapper calls this when the app is launched by double-clicking
  // a .gpx file, or when one is opened while the app is already running.
  // Harmless in a plain browser - nothing ever calls it.
  window.__windlogOpenTrack = function(name, kind, payload){
    try {
      const label = String(name || "Session").replace(/\.(gpx|sbp)$/i, "");
      let pts;
      if (kind === "sbp"){
        // Binary, so it arrives base64 encoded - turn it back into bytes.
        const bin = atob(payload);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        pts = parseSBP(bytes.buffer);
      } else {
        pts = parseGPX(payload);
      }
      loadPoints(pts, label);
    } catch (e){
      document.getElementById("emptyWrap").style.display = "flex";
      showError(e.message);
    }
  };

  document.getElementById("basemapSeg").addEventListener("click", (e) => {
    const btn = e.target.closest("button"); if (!btn) return;
    document.querySelectorAll("#basemapSeg button").forEach(b => b.classList.toggle("active", b===btn));
    basemapMode = btn.dataset.basemap;
    setBasemapStyle();
  });

  // Clicking the track jumps the cursor to that moment. The tolerance is in
  // screen pixels, so it feels the same however far you are zoomed in.
  function wireMapClick(){
    if (!map) return;
    map.on("click", (e) => {
      if (!points.length || !hasTime) return;
      const idx = nearestPointIndex({ lat: e.lngLat.lat, lng: e.lngLat.lng }, 25);
      if (idx < 0) return;              // clicked empty water - ignore
      setCursorToTime(points[idx].t);
    });
  }

  // ============================================================
  // TIMELINE INTERACTION
  // Keyboard is the primary interface (arrows scrub, +/- zoom, home/end
  // jump); pointer drag and wheel are there for mouse users.
  // ============================================================
  document.getElementById("tlSelClear").addEventListener("click", clearSelection);
  document.getElementById("tlZoomIn").addEventListener("click", () => { if (points.length) zoomTimeline(0.5); });
  document.getElementById("tlZoomOut").addEventListener("click", () => { if (points.length) zoomTimeline(2); });

  const tlCanvas = document.getElementById("timelineCanvas");

  /** Map a viewport x-coordinate to an elapsed time in the current view.
   *  padL/padR MUST match drawTimeline() or the cursor lands offset from the
   *  pointer. */
  function timeAtClientX(clientX){
    const rect = tlCanvas.getBoundingClientRect();
    const padL = 38, padR = 8;   // must match drawTimeline
    const plotW = rect.width - padL - padR;
    const rel = Math.max(0, Math.min(1, (clientX - rect.left - padL) / plotW));
    return tlViewStart + rel * tlViewSpan;
  }

  let tlDragging = false;
  tlCanvas.addEventListener("pointerdown", (e) => {
    if (!points.length || !hasTime) return;
    tlCanvas.setPointerCapture(e.pointerId);
    document.getElementById("timeline").focus();

    // Ctrl (or Cmd on a Mac) turns the drag into a range selection instead
    // of a scrub. Held modifiers are read per-event, so the choice is made
    // at press time and stays consistent for the whole drag.
    if (e.ctrlKey || e.metaKey){
      tlSelecting = true;
      tlSelAnchor = timeAtClientX(e.clientX);
      tlSelCurrent = tlSelAnchor;
      scheduleTimeline();
    } else {
      tlDragging = true;
      setCursorToTime(timeAtClientX(e.clientX));
    }
  });

  tlCanvas.addEventListener("pointermove", (e) => {
    if (tlSelecting){
      tlSelCurrent = timeAtClientX(e.clientX);
      scheduleTimeline();
    } else if (tlDragging){
      setCursorToTime(timeAtClientX(e.clientX));
    }
  });

  ["pointerup","pointercancel"].forEach(evt =>
    tlCanvas.addEventListener(evt, () => {
      if (tlSelecting){
        tlSelecting = false;
        setSelection(tlSelAnchor, tlSelCurrent);
      }
      tlDragging = false;
    })
  );

  tlCanvas.addEventListener("wheel", (e) => {
    if (!points.length || !hasTime) return;
    e.preventDefault();
    if (e.ctrlKey || Math.abs(e.deltaY) > Math.abs(e.deltaX)){
      zoomTimeline(e.deltaY > 0 ? 1.15 : 0.87);
    } else {
      tlViewStart += (e.deltaX / tlCanvas.clientWidth) * tlViewSpan;
      clampView();
      scheduleTimeline();
    }
  }, { passive: false });

  window.addEventListener("keydown", (e) => {
    if (!points.length || !hasTime) return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;

    const fast = e.shiftKey ? 15 : 1;
    switch (e.key){
      case "ArrowRight": e.preventDefault(); moveCursor(fast); break;
      case "ArrowLeft":  e.preventDefault(); moveCursor(-fast); break;
      case "Home":       e.preventDefault(); tlCursorIdx = 0; ensureCursorVisible(); updateReadout(); updateCursorMarker(); scheduleTimeline(); break;
      case "End":        e.preventDefault(); tlCursorIdx = points.length-1; ensureCursorVisible(); updateReadout(); updateCursorMarker(); scheduleTimeline(); break;
      case "+": case "=": e.preventDefault(); zoomTimeline(0.5); break;
      case "-": case "_": e.preventDefault(); zoomTimeline(2); break;
      case "Escape": if (selection){ e.preventDefault(); clearSelection(); } break;
      default: return;
    }
  });

  let tlResizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(tlResizeTimer);
    tlResizeTimer = setTimeout(() => { if (points.length && hasTime) scheduleTimeline(); }, 150);
  });

})();
</script>

<script>
// ---------------------------------------------------------------------
// Tauri bridge. Only does anything inside the desktop app; in a browser
// window.__TAURI__ is undefined and this block is skipped entirely.
// ---------------------------------------------------------------------
(function(){
  "use strict";
  if (!window.__TAURI__) return;

  const { invoke } = window.__TAURI__.core;
  const { listen }  = window.__TAURI__.event;

  function hand(file){
    if (!file || !file.contents || !window.__windlogOpenTrack) return;
    window.__windlogOpenTrack(file.name, file.kind, file.contents);
  }

  // Launched by opening a file? Collect it once the UI exists.
  window.addEventListener("DOMContentLoaded", () => {
    invoke("take_opened_file").then(hand).catch(e => console.error("take_opened_file:", e));
  });

  // macOS: a file opened while the app is already running arrives as an event.
  listen("gpx-opened", (evt) => hand(evt.payload))
    .catch(e => console.error("listen(gpx-opened):", e));
})();
</script>
</body>
</html>
