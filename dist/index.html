<!DOCTYPE html>
<!--
  ============================================================================
  GPSFLOW - GPX and SBP track viewer for windsurfing sessions
  ============================================================================

  WHAT IT IS
  A single self-contained HTML file. Drop a .gpx track on it and it shows:
    - the route on a map, coloured by speed
    - session totals (distance, duration, top speed, number of runs)
    - a list of detected "runs" (sustained planing bursts), fastest first
    - a keyboard-scrubbable speed-vs-time timeline

  No build step, no bundler, no server. Open the file and it works.

  DEPENDENCIES
    - MapLibre GL JS 4.7 .. map rendering
    - CARTO vector basemaps (Voyager in light theme, Dark Matter in dark)
    Everything else - GPX and SBP parsing, speed maths, the timeline chart -
    is hand-rolled. The timeline in particular is a custom <canvas> renderer
    rather than a charting library; see the TIMELINE section for why.

    The basemaps are VECTOR rather than raster. Raster tiles carry an
    "API key required" watermark, are being retired by CARTO, and can't be
    restyled; vector is sharper at every zoom and follows the app's theme.
    A CARTO key is optional today; see styleUrl() to add one.

  DATA FLOW (the whole app in one line)
    file -> parseGPX() -> computeDerived() -> detectWaves() -> render*()

    parseGPX()       raw XML  -> [{lat, lon, time, ele}]
    computeDerived() adds per-point speed/distance/elapsed-time, sets hasTime
    detectWaves()    scans for runs above PLANING_THRESHOLD_KMH
    rebuildAll()     redraws stats, run list, map track and timeline

  KEY CONVENTIONS
    - Speed is stored internally in METRES PER SECOND, always. Conversion to
      the display unit happens only at render time via toUnit(). Don't store
      converted values; switching units re-renders from the same m/s source.
    - `points[i].t` is ELAPSED seconds since the first fix. `points[i].time`
      is the real Date. The timeline shows wall-clock time derived from the
      latter; see wallDate().
    - "wave" in identifier names is a leftover from when this was a surfing
      tool. It means "run" (a planing burst) everywhere. Renaming it is safe
      but touches a lot of lines, so it was left alone.

  PERFORMANCE NOTES (learned the hard way - please read before changing)
    A typical session is 1Hz for 1-2 hours, so 5,000-10,000 points. Two things
    fall over at that size if you're not careful:
      1. One map layer per GPS sample. drawTrack() merges consecutive samples
         of similar speed into single polylines instead (~70% fewer layers).
      2. Charting libraries drawing every point with per-point styling. The
         timeline aggregates min/max per pixel column instead, which is O(px)
         rather than O(points) and renders a full session in ~5ms.

  LAYOUT
    The page is locked to the viewport (html/body overflow:hidden). Only the
    run list scrolls. Nothing else moves.
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPSFlow — GPX &amp; SBP track viewer</title>
<!-- Assets are loaded from ./vendor so the app works with no internet.
     Run scripts/vendor-assets.sh once to populate that folder. If it is
     missing, the fallback below pulls Leaflet from a CDN instead, so the
     app still runs online in an un-vendored checkout. -->
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="vendor/fonts.css">
<script src="vendor/maplibre-gl.js"></script>
<script>
  // MapLibre is only touched once a file is loaded, so an async fallback has
  // ample time to arrive before it is needed.
  if (!window.maplibregl) {
    console.warn("Vendored MapLibre missing - falling back to CDN. Run scripts/vendor-assets.sh for offline use.");
    var lcss = document.createElement("link");
    lcss.rel = "stylesheet";
    lcss.href = "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css";
    document.head.appendChild(lcss);
    var ljs = document.createElement("script");
    ljs.src = "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js";
    document.head.appendChild(ljs);
  }
</script>
<style>
  /* ------------------------------------------------------------------
     DESIGN TOKENS
     Dark nautical palette. --ocean/--seafoam/--sand/--coral double as the
     speed ramp: the same four colours are hardcoded as RGB triplets in
     COLOR_STOPS in the script, so if you restyle here, update those too.
     ------------------------------------------------------------------ */
  :root{
    /* Dark theme (default). The original ocean palette, pulled a few stops
       darker than it started. Light theme overrides live in the block below;
       every colour the app draws - including the <canvas> timeline - comes
       from these variables, so the two themes stay in sync automatically. */
    --bg: #061019;
    --bg-deep: #030A10;
    --panel: #0A1A23;
    --panel-2: #10242F;
    --line: rgba(234,243,241,0.10);
    --line-strong: rgba(234,243,241,0.20);
    --text: #EAF3F1;
    --text-dim: #8FAAAC;
    --ocean: #2E7C93;
    --seafoam: #3FBFAD;
    --sand: #F2B84B;
    --coral: #E5533C;
    --btn-hover: #57cdbc;
    --on-accent: #04211D;      /* text sitting on a --seafoam fill */
    --track-gap: #5b6f73;      /* dashed recording-gap segments */
    --map-backdrop: #08161D;
    /* Timeline canvas: JS reads these rather than hardcoding hex */
    --grid: rgba(234,243,241,0.07);
    --cursor-line: rgba(234,243,241,0.75);
    --thresh-line: rgba(234,243,241,0.32);
    --run-band: rgba(229,83,60,0.10);
    --sel-dim: rgba(3,10,16,0.55);      /* veil over unselected time */
    --sel-edge: #3FBFAD;                /* selection boundary lines */
    --marker-stroke: #030A10;

    /* Open Sans throughout. --font-display is kept as a separate token so
       headings/stats can be given their own face again later without
       touching every rule. */
    --font-display: 'Open Sans', system-ui, -apple-system, sans-serif;
    --font-body: 'Open Sans', system-ui, -apple-system, sans-serif;
  }

  /* Light theme. Accents are darkened versions of the same hues so they keep
     enough contrast against pale surfaces. */
  html[data-theme="light"]{
    --bg: #EEF3F4;
    --bg-deep: #E3EBEC;
    --panel: #FFFFFF;
    --panel-2: #F1F6F7;
    --line: rgba(8,26,34,0.12);
    --line-strong: rgba(8,26,34,0.22);
    --text: #0B1E26;
    --text-dim: #5A767D;
    --ocean: #24697E;
    --seafoam: #178A79;
    --sand: #B37B0C;
    --coral: #C43F26;
    --btn-hover: #12766A;
    --on-accent: #FFFFFF;
    --track-gap: #93A7AC;
    --map-backdrop: #DCE6E8;
    --grid: rgba(8,26,34,0.09);
    --cursor-line: rgba(8,26,34,0.70);
    --thresh-line: rgba(8,26,34,0.35);
    --run-band: rgba(196,63,38,0.10);
    --sel-dim: rgba(238,243,244,0.62);
    --sel-edge: #178A79;
    --marker-stroke: #FFFFFF;
  }

  /* The page never scrolls. The app is exactly one viewport tall and the
     run list is the only scrollable region inside it. */
  *{ box-sizing: border-box; }
  html,body{ height:100%; overflow:hidden; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  ::selection{ background: var(--seafoam); color: var(--on-accent); }

  .app{ height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  /* ---------- Header ---------- */
  header{
    position: relative;
    padding: 18px 28px 16px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);   /* flat - same colour as the rest of the app */
    flex-shrink:0;
  }
  /* Only the icon controls live here now; the stats sit further left. */
  .header-right{
    display:flex;
    align-items:center;
    gap: 8px;
    flex-shrink: 0;
  }
  /* Pushed up against the wordmark, with the icons taking the far right. */
  .session-meta{ margin-left: 34px; margin-right: auto; }
  /* Square icon button, sized to sit level with the theme toggle. */
  .icon-btn{
    background: transparent;
    border: 1px solid var(--line-strong);
    color: var(--text-dim);
    border-radius: 6px;
    width: 31px;
    height: 31px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .icon-btn:hover{ background: var(--panel-2); color: var(--text); }
  .icon-btn[aria-expanded="true"]{ background: var(--panel-2); color: var(--text); border-color: var(--seafoam); }

  .theme-toggle{
    background: transparent;
    border: 1px solid var(--line-strong);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 6px 11px;
    font-size: 12.5px;
    font-family: var(--font-body);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .theme-toggle:hover{ background: var(--panel-2); color: var(--text); }

  .header-row{
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  /* Logo lockup: the mark stands beside the title AND tagline together, so
     it can be tall without unbalancing the row. Saturation and opacity are
     pulled back slightly so a hand-drawn illustration sits quietly next to
     the type instead of shouting over it. */
  .brand{
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .brand-mark{
    height: 52px;
    width: auto;
    display:block;
    opacity: 0.92;
    filter: saturate(0.8);
    flex-shrink:0;
    margin-left: -4px;   /* optical alignment: art has more visual air than the type */
  }
  html[data-theme="light"] .brand-mark{ opacity: 0.95; filter: saturate(0.85); }
  .brand-text{ min-width:0; }

  .brand h1{
    font-family: var(--font-display);
    font-weight:700;
    font-size: 27px;
    margin:0;
    letter-spacing: -0.3px;
  }
  .brand p{
    margin: 4px 0 0;
    color: var(--text-dim);
    font-size: 13.5px;
  }
  .session-meta{
    display:flex;
    gap: 22px;
    flex-wrap: wrap;
  }
  .session-meta .stat{ min-width: 78px; }
  .session-meta .stat .num{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 22px;
    letter-spacing: -0.2px;
    font-variant-numeric: tabular-nums;
    line-height:1;
  }
  .session-meta .stat .lbl{
    display:block;
    color: var(--text-dim);
    font-size: 11.5px;
    margin-top: 4px;
  }
  /* All four stats share the plain text colour - no per-stat tinting. */
  .session-meta .stat .num{ color: var(--text); }

  /* ---------- Display menu ----------
     The settings that used to occupy a full toolbar row now sit behind an
     eye icon in the header, which buys the map and the results list the
     whole height that bar was taking. */
  .menu-wrap{ position: relative; }
  .menu-btn[aria-expanded="true"]{ background: var(--panel-2); }
  .menu-panel{
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 900;
    min-width: 240px;
    padding: 12px;
    background: var(--panel-2);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .menu-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 14px;
  }
  .menu-row label{ color: var(--text-dim); font-size: 12.5px; }
  .seg{
    display:inline-flex;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    overflow:hidden;
  }
  .seg button{
    background: transparent;
    color: var(--text-dim);
    border:none;
    padding: 6px 12px;
    font-size: 13px;
    font-family: var(--font-body);
    cursor:pointer;
    border-right: 1px solid var(--line-strong);
  }
  .seg button:last-child{ border-right:none; }
  .seg button.active{ background: var(--ocean); color:#fff; }
  .seg button:hover:not(.active){ background: var(--panel-2); color: var(--text); }

  button.ghost{
    background: transparent;
    border: 1px solid var(--line-strong);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor:pointer;
    font-family: var(--font-body);
  }
  button.ghost:hover{ background: var(--panel-2); }


  /* ---------- Empty state ---------- */
  .empty-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 20px;
  }
  .dropzone{
    width: min(560px, 100%);
    border: 1.5px dashed var(--line-strong);
    border-radius: 10px;
    padding: 44px 32px;
    text-align:center;
    background: var(--panel);
    transition: border-color .15s, background .15s;
  }
  .dropzone.drag{ border-color: var(--seafoam); background: var(--panel-2); }
  .dropzone h2{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 20px;
    margin: 0 0 6px;
  }
  .dropzone p{ color: var(--text-dim); font-size: 13.5px; margin: 0 0 22px; }
  .dropzone .actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn-primary{
    background: var(--seafoam);
    color: var(--on-accent);
    border:none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor:pointer;
    font-family: var(--font-body);
  }
  .btn-primary:hover{ background:var(--btn-hover); }
  .btn-secondary{
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line-strong);
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor:pointer;
    font-family: var(--font-body);
  }
  .btn-secondary:hover{ background: var(--panel-2); }
  .error-msg{
    margin-top: 16px;
    color: var(--coral);
    font-size: 13px;
  }
  #fileInput{ display:none; }

  /* ---------- Main dashboard ----------
     .dash is the flexible middle row (map + sidebar); the timeline below it
     is fixed height. min-height:0 is required or the flex children refuse to
     shrink and push the timeline off-screen. */
  .dash{ flex:1; display:flex; min-height:0; }
  .map-col{ flex: 1 1 62%; position: relative; min-width: 0; }
  #map{ position:absolute; inset:0; background: var(--map-backdrop); }
  /* Attribution must stay visible (CARTO/OpenStreetMap terms), but it can
     be quiet about it. */
  .maplibregl-ctrl-attrib{ font-size: 10px; }

  /* Credit riding alongside the wordmark. Small and dim enough to read as a
     mark rather than as part of the title. Baseline-aligned to the cap
     height rather than sitting on the wordmark's own baseline. */
  .copyright{
    font-size: 8px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    opacity: 0.55;
    margin-left: 6px;
    vertical-align: 5px;
    white-space: nowrap;
    user-select: none;
  }
  .maplibregl-ctrl-attrib-inner{ opacity: 0.85; }

  .side-col{
    flex: 1 1 38%;
    max-width: 380px;
    border-left: 1px solid var(--line);
    background: var(--bg);
    display:flex;
    flex-direction:column;
    min-height:0;
    gap: 10px;
    padding: 10px;
  }
  /* Two visually distinct boxes: the category picker, and the results for
     whichever category is picked. They do different jobs, so they read as
     separate cards rather than one continuous list. */
  .side-box{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    /* Sit at natural height and never give ground. Without this the category
       box shrinks as the results list grows, squashing its six rows. */
    flex: 0 0 auto;
  }
  /* The results box is the one that absorbs the leftover space, and its list
     scrolls inside it. min-height:0 is what lets a flex child actually be
     shorter than its content instead of forcing the column taller. */
  .side-box.results-box{
    flex: 1 1 auto;
    min-height: 0;
  }
  .side-col h3{
    font-family: var(--font-display);
    font-weight:600;
    font-size: 14px;
    letter-spacing: 0.02em;
    margin: 0;
    padding: 16px 18px 10px;
    color: var(--text);
    border-bottom: 1px solid var(--line);
  }
  /* Category picker. Laid out as a grid of chips rather than list rows: the
     job here is choosing, and chips read as controls where flat rows read as
     information. */
  .best-panel{
    flex-shrink:0;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    padding: 10px 12px 12px;
  }
  .best-chip{
    display:flex;
    flex-direction:column;
    gap: 3px;
    padding: 8px 10px;
    background: var(--panel-2);
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    cursor: pointer;
    transition: border-color .12s ease, transform .12s ease, background .12s ease;
  }
  .best-chip:hover{
    border-color: var(--seafoam);
    transform: translateY(-1px);
  }
  .best-chip:active{ transform: translateY(0); }
  .best-chip.active{
    border-color: var(--seafoam);
    background: var(--panel-2);
    box-shadow: inset 0 0 0 1px var(--seafoam);
  }
  .best-chip .cat{
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }
  .best-chip.active .cat{ color: var(--seafoam); }
  .best-chip .val{
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height:1.1;
  }
  .best-chip .val small{ font-weight:400; color: var(--text-dim); font-size: 10.5px; margin-left:2px; }
  .best-empty{ padding: 12px 18px; font-size:12px; color: var(--text-dim); grid-column: 1 / -1; }

  /* A hint under the heading, since the chips are the main control here. */
  .side-box h3 .sub-hint{
    display:block;
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0;
    margin-top: 2px;
  }

  .wave-list{
    overflow-y:auto;
    flex:1;
    min-height:0;
    scrollbar-width: thin;
    scrollbar-color: var(--line-strong) transparent;
  }
  .wave-list::-webkit-scrollbar{ width: 8px; }
  .wave-list::-webkit-scrollbar-track{ background: transparent; }
  .wave-list::-webkit-scrollbar-thumb{ background: var(--line-strong); border-radius: 4px; }
  .wave-list::-webkit-scrollbar-thumb:hover{ background: var(--ocean); }
  .wave-item{
    position: relative;
    display:flex;
    align-items:center;
    gap: 11px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    cursor:pointer;
    overflow: hidden;
  }
  /* Speed bar behind each row, scaled against the best result in the list.
     Width is set from JS (element.style), not a markup style attribute,
     because a nonce-bearing CSP drops those - see the utilities note. */
  .wave-item::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width: var(--bar, 0%);
    background: linear-gradient(90deg, rgba(229,83,60,0.22), rgba(229,83,60,0.02));
    pointer-events:none;
  }
  .wave-item > *{ position: relative; }
  .wave-item:hover{ background: var(--panel-2); }
  .wave-item.pulse{ background: var(--panel-2); box-shadow: inset 3px 0 0 var(--coral); }
  .wave-item:hover .wave-go{ opacity: 1; transform: translateX(0); }
  .wave-rank{
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    width: 20px; height: 20px;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border: 1px solid var(--line-strong);
    border-radius: 50%;
  }
  .wave-item.pulse .wave-rank{ border-color: var(--coral); color: var(--coral); }
  /* A chevron that slides in on hover, so rows read as navigable. */
  .wave-go{
    margin-left:auto;
    color: var(--text-dim);
    font-size: 14px;
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity .12s ease, transform .12s ease;
    flex-shrink:0;
  }
  .wave-info{ flex:1; min-width:0; }
  .wave-info .top{ font-size: 13.5px; }
  .wave-info .top b{ font-variant-numeric: tabular-nums; color: var(--coral); }
  .wave-info .sub{ font-size: 11.5px; color: var(--text-dim); margin-top:2px; }
  .no-waves{ padding: 18px; color: var(--text-dim); font-size: 13px; line-height:1.6; }

  /* ---------- Timeline ----------
     Fixed-height bottom strip. The canvas is absolutely positioned inside
     .tl-canvas-wrap so it can size itself from the flex layout rather than
     needing explicit pixel dimensions. */
  .timeline{
    flex-shrink:0;
    height: 172px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 10px 18px 8px;
    display:flex;
    flex-direction:column;
    outline:none;
  }
  .timeline:focus-within{ box-shadow: inset 0 1px 0 var(--seafoam); }
  .tl-head{
    display:flex; align-items:baseline; gap:14px; margin-bottom:6px; flex-wrap:wrap;
  }
  .tl-head h3{
    font-family: var(--font-display); font-weight:600; font-size:13.5px; letter-spacing:0.02em; margin:0;
  }
  .tl-unit{
    font-size: 11px;
    color: var(--text-dim);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    padding: 2px 7px;
    white-space: nowrap;
  }
  .tl-readout{
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
  }
  .tl-readout b{ color: var(--coral); }
  .tl-readout .t{ color: var(--text); }
  .tl-hint{ margin-left:auto; font-size: 11px; color: var(--text-dim); }

  /* Selection chip: summary of the chosen time range, with a clear button. */
  .tl-sel{
    display:none;
    align-items:center;
    gap: 8px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line-strong);
    border-radius: 5px;
    padding: 3px 6px 3px 9px;
  }
  .tl-sel.on{ display:inline-flex; }
  .tl-sel .sel-clear{
    border:none;
    background: transparent;
    color: var(--text-dim);
    cursor:pointer;
    font-size: 14px;
    line-height:1;
    padding: 0 2px;
    font-family: var(--font-body);
  }
  .tl-sel .sel-clear:hover{ color: var(--coral); }
  .tl-zoom{ display:inline-flex; gap:4px; margin-left:10px; }
  .tl-zoom button{
    background: transparent;
    border: 1px solid var(--line-strong);
    color: var(--text-dim);
    width: 22px; height: 22px;
    border-radius: 4px;
    font-size: 13px; line-height:1;
    cursor:pointer;
    font-family: var(--font-body);
  }
  .tl-zoom button:hover{ background: var(--panel-2); color: var(--text); }
  .tl-canvas-wrap{ flex:1; position:relative; min-height:0; }
  #timelineCanvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    cursor: crosshair;
    display:block;
  }

  @media (max-width: 860px){
    .dash{ flex-direction: column; }
    .map-col{ height: 42vh; flex: none; }
    .side-col{ max-width:none; border-left:none; border-top:1px solid var(--line); }
    .session-meta{ gap:16px; }
    .timeline{ height: 150px; }
    .tl-hint{ display:none; }
  }

  /* Run pins and endpoint dots are drawn by MapLibre as circle layers now,
     so they move with the map instead of being repositioned per frame by
     JavaScript. Their sizes and colours live in ensureMapLayers(). */

  /* ---------- Utilities ----------
     These MUST stay at the end of the stylesheet. .is-hidden competes with
     rules like .dash{display:flex} at equal specificity, so source order is
     what decides the winner - defined earlier, it silently loses and nothing
     hides. Deliberately not !important: the app shows panels by setting
     element.style.display from JS, and an inline style must be able to win.

     These exist instead of inline style="..." attributes because a CSP with
     a nonce (which Tauri adds in production builds) makes browsers ignore
     'unsafe-inline', silently dropping style attributes in the markup. */
  .is-hidden{ display:none; }
  .push-right{ margin-left:auto; }
  .full-width-btn{ width:100%; margin-top:6px; }
</style>

      <!-- Box 1: pick a category. Each row shows that category's best result,

       no timestamps, where speed can't be derived. -->

        <button id="tlZoomIn" title="Zoom in (+)">+</button>
      </span>

    <div class="tl-canvas-wrap">
      <canvas id="timelineCanvas"></canvas>
    </div>
  </div>
