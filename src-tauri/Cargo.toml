[package]
name = "windlog"
version = "1.0.0"
description = "GPX speed and track viewer for windsurfing"
edition = "2021"
rust-version = "1.77"

# The binary name the bundler wires the file association to.
[[bin]]
name = "windlog"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
